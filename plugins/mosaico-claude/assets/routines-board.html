<title>Outreach Routines Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400;500&display=swap">
<!--
  DATABASE SCHEMA (db capability). Every document id equals its `id` field.
  Times are ISO 8601 strings (UTC). The page reads only; it writes one field (actions.status).

  routine keys: "follow-up" | "send-invitations" | "load-leads" | "withdraw"
                (improvements may also use "all")

  runs/<id>          one per routine run
    id          string   session id or runId
    routine     string   routine key
    startedAt   string   ISO
    endedAt     string   ISO
    outcome     string   "complete" | "blocked" | "nothing-to-do" | "failed" | "refused-busy"
    headline    string   one sentence
    counts      object   { <name>: number }  free keys, e.g. sent, drafted, saved, verified, skipped, dropped
    notes       string[] short notes
    reportText  string   the run's own final report, plain text

  actions/<id>       things Gui must do
    id, routine, createdAt (ISO), text, status ("open" | "done"), source (run id)

  issues/<id>        defects or blockers seen in runs
    id, routine, firstSeenAt (ISO), lastSeenAt (ISO), text, status ("open" | "fixed"), fixRef (free text)

  improvements/<id>  ideas with a reason
    id, routine (key or "all"), createdAt (ISO), text, status ("open" | "done" | "rejected")

  meta/board         one document
    lastUpdatedAt (ISO), lastUpdatedBy (string),
    states (optional object { <routine key>: "on" | "paused" }) overrides the default on/paused labels

  Access rules: everyone admitted reads; only Editors/Owner (admin) write.

  WRITING (a routine records its run, with the ArtifactData tool and this page's address as url): one batch, after the run's report.
  Get each document before updating it and pass its version as if_version; create one that does not exist without it.
  runs id = the run's runId (else "<routine key>-<start as yyyymmddhhmm, UTC>"). outcome: "nothing-to-do" for a run Mosaico ended
  complete with nothing to do, "refused-busy" for a start Mosaico refused because another run was working, "failed" for a run that
  failed or stopped with work open. counts holds only numbers from Mosaico's report.
  actions id = "act-<slug>-<yyyymmdd>" (a few lowercase words; the run's day); leave an existing one alone. issues id = "iss-<slug>":
  keep firstSeenAt and fixRef, set lastSeenAt, status "open" (a fixed issue that returns is open again).
  meta/board: id "board", lastUpdatedAt now, lastUpdatedBy "<routine name> run"; keep states; never write improvements.
  The Routines report writes the runs a routine could not: id "sched-<routine key>-<start as yyyymmddhhmm, UTC>", notes include
  "recorded by the Routines report", and it invents nothing the run's report does not state.
  A failed write is one line in the report ("Routines Board not updated: <reason>"), never a retry loop and never a halt.
-->
<style>
/* Layout: one narrow column; "Needs you" queue first, then a stack of routine cards in schedule order. */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#eceef3; --fg:#171b26; --muted:#5b6274; --line:#dcdfe7;
  --accent:#3646c9; --accent-soft:#e6e8fb;
  --ok:#1f8a4c; --idle:#8a90a0; --warn:#b7791f; --bad:#c2410c;
  --font-display:"Fraunces", Georgia, serif;
  --font-body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141c; --surface:#191d28; --sunk:#141821; --fg:#e7e9f0; --muted:#9aa1b3; --line:#2a3040;
  --accent:#8f9bff; --accent-soft:#252b4a;
  --ok:#4ccf83; --idle:#7c8396; --warn:#e8a93c; --bad:#f2814a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141c; --surface:#191d28; --sunk:#141821; --fg:#e7e9f0; --muted:#9aa1b3; --line:#2a3040;
  --accent:#8f9bff; --accent-soft:#252b4a;
  --ok:#4ccf83; --idle:#7c8396; --warn:#e8a93c; --bad:#f2814a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--font-display);font-weight:600;font-size:1.9rem;line-height:1.1;margin:0;text-wrap:balance}
.updated{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.chip b{color:var(--fg);font-variant-numeric:tabular-nums}
.chip.hot{background:var(--accent-soft);border-color:transparent}
.chip.hot b{color:var(--accent)}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:600}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.toggle{font:inherit;font-size:.85rem;color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer}
.toggle:focus-visible,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.queue{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.act{display:grid;grid-template-columns:1fr auto;gap:6px 14px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.act:first-child{border-top:0}
.act-meta{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.act-text{grid-column:1;min-width:0}
.act .btn{grid-row:1 / span 2;grid-column:2}
.act.done .act-text{color:var(--muted);text-decoration:line-through}
.tag{font-family:var(--font-mono);font-size:.72rem;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.btn{font:inherit;font-size:.85rem;font-weight:600;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.empty{padding:16px 14px;color:var(--muted);font-size:.9rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.card h3{font-family:var(--font-display);font-weight:600;font-size:1.25rem;margin:0}
.sched{font-size:.85rem;color:var(--muted)}
.state{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.state.on{color:var(--ok)}
.state.paused{color:var(--warn)}
.last{display:flex;flex-direction:column;gap:6px}
.outcome{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--idle);flex:none}
.dot.complete{background:var(--ok)} .dot.nothing-to-do{background:var(--idle)}
.dot.blocked,.dot.failed,.dot.refused-busy{background:var(--warn)}
.headline{font-size:1rem;font-weight:500;margin:0}
.notes{margin:0;padding-left:18px;color:var(--muted);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.stat b{font-family:var(--font-mono);font-size:1.2rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.runs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.runs details{border-bottom:1px solid var(--line)}
.runs summary{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 0;cursor:pointer;list-style:none;align-items:center}
.runs summary::-webkit-details-marker{display:none}
.runs summary .dot{grid-row:1 / span 2}
.run-when{font-family:var(--font-mono);font-size:.75rem;color:var(--muted)}
.run-head{font-size:.9rem;min-width:0}
.report{margin:0 0 12px 19px;padding:10px 12px;background:var(--sunk);border-radius:8px;font-family:var(--font-mono);font-size:.78rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.subs{grid-template-columns:1fr}}
.sub{display:flex;flex-direction:column;gap:6px;min-width:0}
.sub ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.sub li{font-size:.88rem;padding:8px 10px;border-radius:8px;border-left:3px solid var(--line);background:var(--sunk)}
.sub li.issue{border-left-color:var(--bad)}
.sub li.idea{border-left-color:var(--accent)}
.ref{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.none{font-size:.85rem;color:var(--muted)}
.banner{font-size:.88rem;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s,color .15s}}
</style>

<div class="wrap">
  <header>
    <h1>Outreach Routines Board</h1>
    <div class="updated" id="updated">Waiting for the board data.</div>
    <div class="chips" id="chips"></div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <section class="sec" aria-labelledby="needs-h">
    <div class="sec-head">
      <h2 id="needs-h">Needs you</h2>
      <button class="toggle" id="show-done" type="button" aria-pressed="false">Show done</button>
    </div>
    <div class="queue" id="queue"><div class="empty">Nothing waiting for you. Routines add actions here after each run.</div></div>
  </section>
  <section class="sec" aria-labelledby="routines-h">
    <h2 id="routines-h">Routines</h2>
    <div class="sec" id="routines"></div>
  </section>
</div>

<script>
(function(){
  const ROUTINES = [
    {key:"follow-up", name:"Follow-up", schedule:"Daily 6:45 PM and 10:45 PM", state:"on"},
    {key:"send-invitations", name:"Send invitations", schedule:"Daily 6:00 AM", state:"on"},
    {key:"load-leads", name:"Load leads", schedule:"5 AM", state:"on"},
    {key:"withdraw", name:"Withdraw stale invitations", schedule:"11:30 PM", state:"paused"}
  ];
  const NAME = Object.fromEntries(ROUTINES.map(r=>[r.key,r.name]));
  NAME.all = "All routines";
  const OUTCOME = {"complete":"Complete","nothing-to-do":"Nothing to do","blocked":"Blocked","failed":"Failed","refused-busy":"Refused, busy"};
  const TZ = "Pacific/Auckland";
  const fmt = new Intl.DateTimeFormat("en-NZ",{timeZone:TZ,weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
  function when(iso){ const d = new Date(iso); return isNaN(d) ? "" : fmt.format(d); }
  function dur(a,b){ const ms = new Date(b)-new Date(a); if(!(ms>0)) return ""; const m=Math.round(ms/60000); return m<60? m+" min" : Math.floor(m/60)+" h "+(m%60)+" min"; }
  function humanKey(k){ return String(k).replace(/([a-z])([A-Z])/g,"$1 $2").replace(/[-_]/g," ").toLowerCase(); }
  function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function str(v){ return typeof v==="string" ? v : ""; }

  const state = {runs:[], actions:[], issues:[], improvements:[], meta:null, showDone:false, canWrite:true, db:null, busy:new Set()};
  try{ state.showDone = localStorage.getItem("rb-show-done")==="1"; }catch(e){}

  function chip(label, n){ const c=el("span","chip"+(n>0?" hot":"")); const b=el("b",null,String(n)); c.append(b, document.createTextNode(" "+label)); return c; }

  function renderHeader(){
    const m = state.meta;
    document.getElementById("updated").textContent = m && m.lastUpdatedAt
      ? "Updated " + when(m.lastUpdatedAt) + " Auckland" + (m.lastUpdatedBy ? " by " + m.lastUpdatedBy : "")
      : "No updates yet. Routines write here after each run.";
    const chips = document.getElementById("chips"); chips.replaceChildren(
      chip("Actions", state.actions.filter(a=>a.status!=="done").length),
      chip("Issues", state.issues.filter(i=>i.status!=="fixed").length),
      chip("Improvements", state.improvements.filter(i=>(i.status||"open")==="open").length));
  }

  async function markDone(a){
    if(!state.db || state.busy.has(a.id)) return;
    state.busy.add(a.id); renderQueue();
    try{ await state.db.collection("actions").doc(a.id).update({status:"done"}); }
    catch(e){
      if(e && e.code==="invalid_argument"){ state.canWrite=false; showBanner("You can read this board but not change it."); }
      else showBanner("Could not mark that action done. Try again in a moment.");
    }
    state.busy.delete(a.id); renderQueue();
  }

  function renderQueue(){
    const q = document.getElementById("queue");
    const btn = document.getElementById("show-done");
    btn.textContent = state.showDone ? "Hide done" : "Show done";
    btn.setAttribute("aria-pressed", String(state.showDone));
    const list = state.actions.filter(a=>state.showDone || a.status!=="done")
      .sort((x,y)=>str(y.createdAt).localeCompare(str(x.createdAt)) || str(x.id).localeCompare(str(y.id)));
    if(!list.length){ q.replaceChildren(el("div","empty", state.actions.length ? "All actions are done." : "Nothing waiting for you. Routines add actions here after each run.")); return; }
    q.replaceChildren(...list.map(a=>{
      const row = el("div","act"+(a.status==="done"?" done":""));
      const meta = el("div","act-meta"); meta.append(el("span","tag",NAME[a.routine]||a.routine||"Routine"), el("span",null,when(a.createdAt)));
      row.append(meta);
      if(a.status!=="done" && state.canWrite){
        const b = el("button","btn", state.busy.has(a.id) ? "Saving" : "Done"); b.type="button"; b.disabled = state.busy.has(a.id) || !state.db;
        b.setAttribute("aria-label","Mark done: "+str(a.text)); b.addEventListener("click",()=>markDone(a)); row.append(b);
      }
      row.append(el("div","act-text",str(a.text)));
      return row;
    }));
  }

  function renderRoutines(){
    const host = document.getElementById("routines");
    const states = (state.meta && state.meta.states) || {};
    host.replaceChildren(...ROUTINES.map(r=>{
      const card = el("article","card");
      const head = el("div","card-head");
      const t = el("div"); t.append(el("h3",null,r.name), el("div","sched",r.schedule+", Auckland time"));
      const st = states[r.key] || r.state; head.append(t, el("span","state "+st, st==="paused"?"Paused":"On"));
      card.append(head);
      const runs = state.runs.filter(x=>x.routine===r.key).sort((a,b)=>str(b.startedAt).localeCompare(str(a.startedAt)));
      if(!runs.length){ card.append(el("p","none","No runs yet. The last run will show here once this routine reports.")); }
      else {
        const last = runs[0];
        const box = el("div","last");
        const oc = el("div","outcome"); oc.append(el("span","dot "+str(last.outcome)), el("span",null,(OUTCOME[last.outcome]||last.outcome||"Unknown")+" · "+when(last.startedAt)+(dur(last.startedAt,last.endedAt)?" · "+dur(last.startedAt,last.endedAt):"")));
        box.append(oc, el("p","headline",str(last.headline)));
        const notes = Array.isArray(last.notes) ? last.notes.filter(n=>typeof n==="string" && n) : [];
        if(notes.length){ const ul=el("ul","notes"); notes.forEach(n=>ul.append(el("li",null,n))); box.append(ul); }
        card.append(box);
        const counts = last.counts && typeof last.counts==="object" ? Object.entries(last.counts).filter(([,v])=>typeof v==="number") : [];
        if(counts.length){ const g=el("div","stats"); counts.forEach(([k,v])=>{ const s=el("div","stat"); s.append(el("b",null,String(v)), el("span",null,humanKey(k))); g.append(s); }); card.append(g); }
        const rl = el("div","runs");
        runs.slice(0,5).forEach(x=>{
          const d = el("details"); const s = el("summary");
          s.append(el("span","dot "+str(x.outcome)), el("span","run-when",when(x.startedAt)+" · "+(OUTCOME[x.outcome]||x.outcome||"")), el("span","run-head",str(x.headline)));
          d.append(s, el("div","report", str(x.reportText) || "No report text for this run."));
          rl.append(d);
        });
        card.append(el("h2",null,"Last runs"), rl);
      }
      const subs = el("div","subs");
      const iss = state.issues.filter(i=>i.routine===r.key && i.status!=="fixed").sort((a,b)=>str(b.lastSeenAt).localeCompare(str(a.lastSeenAt)));
      const imp = state.improvements.filter(i=>(i.routine===r.key) && (i.status||"open")==="open").sort((a,b)=>str(b.createdAt).localeCompare(str(a.createdAt)));
      subs.append(subList("Open issues", iss, "issue", i=> i.fixRef ? "Fix: "+i.fixRef+" · seen "+when(i.lastSeenAt) : "Seen "+when(i.lastSeenAt)),
                  subList("Improvements", imp, "idea", i=> "Added "+when(i.createdAt)));
      card.append(subs);
      return card;
    }));
    const general = state.improvements.filter(i=>i.routine==="all" && (i.status||"open")==="open");
    if(general.length){ const c=el("article","card"); c.append(subList("Improvements for all routines", general, "idea", i=>"Added "+when(i.createdAt))); host.append(c); }
  }
  function subList(title, items, cls, sub){
    const w = el("div","sub"); w.append(el("h2",null,title));
    if(!items.length){ w.append(el("span","none","None open.")); return w; }
    const ul = el("ul"); items.forEach(i=>{ const li=el("li",cls,str(i.text)); li.append(el("span","ref",sub(i))); ul.append(li); }); w.append(ul); return w;
  }
  function showBanner(t){ const b=document.getElementById("banner"); b.textContent=t; b.hidden=!t; }
  function renderAll(){ renderHeader(); renderQueue(); renderRoutines(); }

  document.getElementById("show-done").addEventListener("click",()=>{ state.showDone=!state.showDone; try{ localStorage.setItem("rb-show-done", state.showDone?"1":"0"); }catch(e){} renderQueue(); });
  renderAll();

  (async function connect(){
    const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
    if(!db){ showBanner("The board data is not available in this view. Open the page signed in to claude.ai."); return; }
    state.db = db;
    try{
      const user = await window.claude.use("user");
      if(user){ const w = await user.can("data.write"); if(w===false) state.canWrite=false; }
    }catch(e){}
    const onErr = e=>{ if(e && e.code!=="revoked") showBanner("Live updates stopped. Reload the page to reconnect."); };
    const bodies = snap => snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    db.collection("runs").orderBy("startedAt","desc").limit(500).onSnapshot(s=>{ state.runs=bodies(s); renderAll(); }, onErr);
    db.collection("actions").onSnapshot(s=>{ state.actions=bodies(s); renderAll(); }, onErr);
    db.collection("issues").onSnapshot(s=>{ state.issues=bodies(s); renderAll(); }, onErr);
    db.collection("improvements").onSnapshot(s=>{ state.improvements=bodies(s); renderAll(); }, onErr);
    db.doc("meta/board").onSnapshot(s=>{ state.meta = s.exists ? s.data() : null; renderAll(); }, onErr);
  })();
})();
</script>
