<!doctype html>
<!--
  The Mosaico page loader.

  This file is a build output (features/core-shell/artifacts/build.ts from mosaico.template.html). It is small on purpose,
  so that any Claude can read all of it before publishing it as an artifact.

  What it does, in order:
    1. Draws a plain "Loading Mosaico..." state on the right background for the viewer's theme.
    2. Loads React 18.3.1 from cdnjs.
    3. Loads the Mosaico page script from the public npm package "mosaico-page" through jsDelivr, at one exact version
       (1.0.1). That script is Mosaico's own and holds screens only; it draws the page and talks to the
       person's own Mosaico connector through claude.ai. It reads its styles from itself, so this file has none to load.
    4. If anything fails to load, shows what failed in words instead of a blank page.

  Mosaico changes the page by publishing a new package version and a new copy of this file that names it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Economica:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">
<script>
/* The page follows the viewer's theme: claude.ai's data-theme, else the system preference, until the person chooses in
   the page's switch (dark or light, kept in localStorage under the key in stand-ins/next-themes.tsx); a choice wins over
   claude.ai's value. The components read the result as the root's "dark" class; the tokens carry the same guards in CSS. */
(function () {
  var root = document.documentElement;
  var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function chosen() {
    try {
      var value = window.localStorage.getItem('mosaico-artifact-theme');
      return value === 'light' || value === 'dark' ? value : null;
    } catch (error) { return null; }
  }
  function apply() {
    var pick = chosen();
    if (pick && root.getAttribute('data-theme') !== pick) root.setAttribute('data-theme', pick);
    var theme = root.getAttribute('data-theme');
    var dark = theme === 'dark' || (theme !== 'light' && !!(media && media.matches));
    root.classList.toggle('dark', dark);
    root.style.colorScheme = dark ? 'dark' : 'light';
  }
  apply();
  if (media && media.addEventListener) media.addEventListener('change', apply);
  if (window.MutationObserver) new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
<style>
/* Only what the loading and error states need. The page script brings every other style with it. */
:root { --loader-bg: #fbf8fc; --loader-ink: #3b2a55; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --loader-bg: #150d25; --loader-ink: #e9e2f5; } }
:root[data-theme="dark"] { --loader-bg: #150d25; --loader-ink: #e9e2f5; }
html { background: var(--loader-bg); }
body { margin: 0; min-height: 100vh; background: var(--loader-bg); color: var(--loader-ink); font-family: Roboto, system-ui, sans-serif; }
.mosaico-loader-note { max-width: 36rem; margin: 0 auto; padding: 4rem 16px; text-align: center; line-height: 1.5; }
.mosaico-loader-note strong { display: block; margin-bottom: 0.5rem; font-size: 1.125rem; }
</style>
</head>
<body class="mos-backdrop min-h-screen">
<div id="mosaico-root"><p class="mosaico-loader-note" id="mosaico-loading">Loading Mosaico&hellip;</p></div>
<script>
/* Says what failed, in words. The page script replaces this state itself when it starts. */
function mosaicoLoadFailed(what) {
  var root = document.getElementById('mosaico-root');
  if (!root) return;
  root.innerHTML = '';
  var note = document.createElement('p');
  note.className = 'mosaico-loader-note';
  var title = document.createElement('strong');
  title.textContent = 'Mosaico could not load.';
  note.appendChild(title);
  note.appendChild(document.createTextNode(what + ' Check the connection and reload this page. If it keeps failing, ask Mosaico to update the page.'));
  root.appendChild(note);
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/mosaico-page@1.0.1/dist/mosaico-page.js" integrity="sha384-pC6CYIwxcNOF7rySZgG6nDOnBQQVmKZug/UHj2qZtanILptiu/y0HYaDKqUoVJg3" crossorigin="anonymous" onerror="mosaicoLoadFailed('The Mosaico page script (mosaico-page 1.0.1) did not load.')"></script>
<script>
/* If React itself did not load, the page script could not start. */
if (!window.React || !window.ReactDOM) mosaicoLoadFailed('React did not load.');
</script>
</body>
</html>
